{% extends "hr/base.html" %}

{% block title %}Edit Profile | Smart HRMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8">
        <div class="card card-custom p-4">
            <h4 class="fw-bold text-primary mb-3">Edit Profile</h4>
            <form method="POST">
                {% csrf_token %}
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">First Name</label>
                        <input type="text" name="first_name" class="form-control" value="{{ hr_profile.user.first_name }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Last Name</label>
                        <input type="text" name="last_name" class="form-control" value="{{ hr_profile.user.last_name }}">
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" value="{{ hr_profile.user.email }}">
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-semibold">Department</label>
                        <select name="department" class="form-select">
                            <option value="">-- Choose Department --</option>
                            {% for dept in departments %}
                                <option value="{{ dept.pk }}" {% if hr_profile.department_id == dept.pk %}selected{% endif %}>
                                    {{ dept.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'hr:profile' %}" class="btn btn-light border">Cancel</a>
                    <button type="submit" class="btn btn-blue">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
