{% extends "hr/base.html" %}

{% block title %}Change Password | Smart HRMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6">
        <div class="card card-custom p-4">
            <h4 class="fw-bold text-primary mb-3">Change Password</h4>
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{% url 'hr:profile' %}" class="btn btn-light border">Cancel</a>
                    <button type="submit" class="btn btn-blue">Update Password</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    document.querySelectorAll("form input").forEach(el => el.classList.add("form-control"));
</script>
{% endblock %}
