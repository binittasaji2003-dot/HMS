[project]
name = "hr_management_system"
version = "0.1.0"
description = "A web-based Smart HR Management System developed using Cookiecutter Django to automate recruitment, employee management, performance monitoring, and HR operations with role-based access for Admin, HR, Employee, and Candidate."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Binitta Saji", email = "binittasaji2003@gmail.com" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "crispy-bootstrap5==2026.3",
  "django==6.1",
  "django-allauth[mfa]==65.19.1",
  "django-anymail==15.1",
  "django-crispy-forms==2.7",
  "django-environ==0.14.0",
  "django-model-utils==5.0.0",
  "django-redis==7.0.0",
  "gunicorn==26.2.0",
  "hiredis==3.4.1",
  "pillow==12.3.0",
  "psycopg[c]==3.3.5",
  "python-slugify==8.0.4",
  "redis==8.1.0",
  "sentry-sdk==2.68.1",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.16.0",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==7.1.1",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.1.0",
  "django-upgrade==1.32.0",
  "djlint==1.44.2",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==2.3.1",
  "pre-commit==4.6.2",
  "psycopg[c]==3.3.5",
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "ruff==0.16.5",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
  "werkzeug[watchdog]==3.1.8",
]

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
custom_blocks = "element,slot"
close_void_tags = true
format_css = true
format_js = true
ignore = "H006,H030,H031"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]

lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.isort.force-single-line = true

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== pytest ====
[tool.pytest]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
python_files = [
  "tests.py",
  "test_*.py",
]

# ==== Coverage ====
[tool.coverage.run]
include = [ "hr_management_system/**" ]
omit = [ "*/migrations/*", "*/tests/*" ]
plugins = [ "django_coverage_plugin" ]

# ==== mypy ====
[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
  "mypy_django_plugin.main",
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
