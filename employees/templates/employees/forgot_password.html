{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - HRMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { hrms: { blue: '#1677ff', hover: '#0958d9' } } } } }
    </script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl p-8 border border-slate-200/80 shadow-xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-blue-50 text-hrms-blue rounded-2xl flex items-center justify-center text-2xl mx-auto">
                <i class="bi bi-key"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900">Reset Your Password</h1>
            <p class="text-xs text-slate-500">Enter your registered email address and we'll send you instructions to reset your password.</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
                {{ form.email }}
            </div>

            <button type="submit" class="w-full h-11 bg-hrms-blue hover:bg-hrms-hover text-white text-xs font-bold rounded-xl shadow-md shadow-blue-500/20 transition-all">
                Send Reset Link
            </button>
        </form>

        <div class="text-center pt-2 text-xs font-medium text-slate-500">
            Remembered your password? <a href="{% url 'employees:login' %}" class="font-bold text-hrms-blue hover:underline">Back to Login</a>
        </div>
    </div>

</body>
</html>
